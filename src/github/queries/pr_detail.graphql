query PrDetail($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      headRefOid
      reactionGroups {
        ...ReactionFields
      }
      comments(first: 100) {
        nodes {
          id
          author {
            __typename
            login
          }
          body
          bodyHTML
          createdAt
          url
          reactionGroups {
            ...ReactionFields
          }
        }
      }
      reviews(last: 50) {
        nodes {
          id
          author {
            __typename
            login
          }
          state
          body
          bodyHTML
          submittedAt
          reactionGroups {
            ...ReactionFields
          }
        }
      }
      reviewThreads(first: 100) {
        nodes {
          id
          isResolved
          path
          line
          comments(first: 50) {
            nodes {
              id
              author {
                __typename
                login
              }
              body
              bodyHTML
              createdAt
              url
              reactionGroups {
                content
                viewerHasReacted
                reactors {
                  totalCount
                }
              }
            }
          }
        }
      }
    }
  }
  rateLimit {
    cost
    remaining
    resetAt
  }
}

# The first two people of a reaction group come with its count. The thread
# comments do not use this fragment: their names make the query cost 53
# points in place of 3 (100 threads, each with 50 comments).
fragment ReactionFields on ReactionGroup {
  content
  viewerHasReacted
  reactors(first: 2) {
    totalCount
    nodes {
      __typename
      ... on Bot {
        login
      }
      ... on Mannequin {
        login
      }
      ... on Organization {
        login
      }
      ... on User {
        login
      }
    }
  }
}
