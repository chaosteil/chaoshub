query ListPrs($search: String!, $first: Int!, $after: String) {
  search(type: ISSUE, query: $search, first: $first, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      __typename
      ... on PullRequest {
        id
        number
        repository {
          nameWithOwner
        }
        state
        updatedAt
        headRefOid
      }
    }
  }
  rateLimit {
    cost
    remaining
    resetAt
  }
}
