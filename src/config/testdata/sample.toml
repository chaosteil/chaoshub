login = "chaosteil"
teams = ["pierredotco/platform"]
launcher = "rex"

[[repo]]
name = "chaosteil/chaoshub"
path = "~/code/chaoshub"

[[repo]]
name = "pierredotco/deploy"

[filters]
created_since = "2026-09-01"

[refresh]
mine_secs = 30
full_secs = 600

[prefetch]
enabled = false

[codeview]
zoom = false
ratio = 70

[merge.repos."pierredotco/deploy"]
method = "rebase"
bypass_rules = true

[merge.repos."chaosteil/chaoshub"]
method = "merge"

[theme]
textures = false
animation_ms = 120

[terminal]
progress = true

[keys]
merge = "M"
refresh = "ctrl-r"

[agent]
command = ["uvx", "--from", "pr-agent", "pr-agent"]
model = "anthropic/claude-sonnet-5-5"
fallback_models = ["openai/gpt-6-luna"]
timeout_secs = 600
extra_instructions = { review = "Focus on correctness." }

[agent.env]
ANTHROPIC__KEY = { command = "op read op://dev/anthropic/key" }
OPENAI__KEY = { from_env = "OPENAI_API_KEY" }

[workspaces]
root = "~/work/ws"
