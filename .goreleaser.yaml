# GoReleaser builds the release of a tag v*. See RELEASING.md and
# .github/workflows/release.yml.
version: 2
project_name: chaoshub

builds:
  - id: chaoshub
    builder: rust
    binary: chaoshub
    # chaoshub uses Unix-only APIs, thus there is no Windows target. The
    # Linux targets use musl, thus the binaries are static.
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      - x86_64-apple-darwin
      - aarch64-apple-darwin

archives:
  - id: chaoshub
    formats: [tar.gz]
    # The name has the Rust target, so cargo-binstall finds the archive
    # ([package.metadata.binstall] in Cargo.toml).
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Target }}"
    files:
      - README.md
      - LICENSE-MIT
      - LICENSE-APACHE

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\([^)]+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\([^)]+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\([^)]+\))?!?:'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - '^(chore|docs|ci|test)(\([^)]+\))?!?:'

release:
  github:
    owner: chaosteil
    name: chaoshub
  prerelease: auto

homebrew_casks:
  - name: chaoshub
    repository:
      owner: chaosteil
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/chaosteil/chaoshub
    description: Terminal app that tracks your GitHub pull requests
    license: MIT OR Apache-2.0
    # A prerelease tag (for example v0.2.0-rc1) does not change the tap.
    skip_upload: auto
    dependencies:
      - formula: gh
      - formula: git
    # The binary is not signed. Without this step, macOS stops the binary
    # because of the quarantine flag of the download.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/chaoshub"]
          end

nfpms:
  - id: chaoshub
    package_name: chaoshub
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Dominykas Djacenko
    homepage: https://github.com/chaosteil/chaoshub
    maintainer: Dominykas Djacenko <chaosteil@gmail.com>
    description: A terminal app that tracks your GitHub pull requests, with jj or git
    license: MIT OR Apache-2.0
    formats: [deb, rpm]
    dependencies:
      - git
      - gh
    # Debian has jj as "jujutsu". A package manager ignores a recommended
    # package that it cannot find.
    recommends:
      - jujutsu
      - neovim
    contents:
      - src: LICENSE-MIT
        dst: /usr/share/doc/chaoshub/LICENSE-MIT
        packager: deb
      - src: LICENSE-APACHE
        dst: /usr/share/doc/chaoshub/LICENSE-APACHE
        packager: deb
      - src: LICENSE-MIT
        dst: /usr/share/licenses/chaoshub/LICENSE-MIT
        packager: rpm
      - src: LICENSE-APACHE
        dst: /usr/share/licenses/chaoshub/LICENSE-APACHE
        packager: rpm
      - src: README.md
        dst: /usr/share/doc/chaoshub/README.md
