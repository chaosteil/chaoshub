[package]
name = "chaoshub"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
etcetera = "0.11.0"
futures = "0.3.34"
graphql_client = "0.16.0"
humantime = "2.4.0"
nucleo-matcher = "0.3.1"
open = "5.4.5"
rand = "0.10.3"
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.41.1", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3.18"
tachyonfx = "0.25.2"
textwrap = "0.16.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "sync", "time", "macros"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tui-markdown = "0.3.12"

[dev-dependencies]
insta = "1.49.0"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
large_enum_variant = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
